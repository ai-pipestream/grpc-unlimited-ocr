name: CI

# Phase 0 gate: build the engine with warnings as errors and the address
# and undefined-behaviour sanitizers, then run the CTest suite. Tests that
# need the model weights skip (77) here; they run where the weights are.
# The CUDA image job compiles the CUDA backend; GPU tests skip on hosted
# runners and run on a GPU host.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Build and test (GCC 15, sanitizers)
    runs-on: ubuntu-latest
    container: gcc:15
    timeout-minutes: 30
    steps:
      # Forgejo executes JavaScript actions with the container's node binary;
      # gcc:15 does not include it. GitHub supplies its own action runtime.
      - name: Install Node for Forgejo actions
        if: ${{ github.server_url != 'https://github.com' }}
        run: apt-get update && apt-get install -y --no-install-recommends nodejs
      - uses: actions/checkout@v7
      - name: Install CMake and Ninja
        run: apt-get update && apt-get install -y --no-install-recommends cmake ninja-build
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DUOCR_WERROR=ON -DUOCR_SANITIZE=address,undefined
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  cuda-image:
    name: CUDA image (builds the CUDA backend, runs the suite)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          sbom: false
          push: false
          build-args: UOCR_REVISION=${{ github.sha }}
