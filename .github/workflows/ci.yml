name: CI

# Phase 0 gate: build the engine with warnings as errors and the address
# and undefined-behaviour sanitizers, then run the CTest suite. Tests that
# need the model weights skip (77) here; they run where the weights are.
# The CUDA image job compiles the CUDA backend; GPU tests skip on hosted
# runners and run on a GPU host. The proto job holds the wire contract to
# buf lint and buf format.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Build and test (GCC 15, sanitizers)
    runs-on: ubuntu-latest
    container: gcc:15
    # gRPC builds from source for the server, and a runner starts cold.
    timeout-minutes: 120
    steps:
      # Forgejo executes JavaScript actions with the container's node binary;
      # gcc:15 does not include it. Use Bun for that compatibility entry point.
      # GitHub supplies its own action runtime.
      - name: Install Bun for Forgejo actions
        if: ${{ github.server_url != 'https://github.com' }}
        env:
          BUN_VERSION: 1.4.4
        run: |
          apt-get update && apt-get install -y --no-install-recommends ca-certificates curl unzip
          case "$(uname -m)" in
            x86_64) target=bun-linux-x64-baseline; checksum=e0446eb55995772eb9894bebae9a6be368d985a8b9271ee124486f9946eedd76 ;;
            aarch64) target=bun-linux-aarch64; checksum=baa6bb36f51d6e58561e02bbea825038a9df454f673d6d776e8bbf86f8c7850e ;;
            *) echo 'Unsupported Bun architecture' >&2; exit 1 ;;
          esac
          curl --fail --location --retry 3 "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/${target}.zip" -o /tmp/bun.zip
          echo "${checksum}  /tmp/bun.zip" | sha256sum --check
          unzip -q /tmp/bun.zip -d /tmp/uocr-bun
          install /tmp/uocr-bun/${target}/bun /usr/local/bin/bun
          ln -s /usr/local/bin/bun /usr/local/bin/node
          bun --version
          node -e 'if (!process.versions.bun) process.exit(1)'
      - uses: actions/checkout@v7
      - name: Install CMake and Ninja
        run: apt-get update && apt-get install -y --no-install-recommends cmake ninja-build
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DUOCR_WERROR=ON -DUOCR_SANITIZE=address,undefined
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  cuda-image:
    name: CUDA image (builds the CUDA backend, runs the suite)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          sbom: false
          push: false
          build-args: UOCR_REVISION=${{ github.sha }}

  proto:
    name: buf lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bufbuild/buf-action@v1
        with:
          # The CLI is pinned and its download verified (buf-Linux-x86_64
          # from the v1.71.0 release), as in grpc-vlm-convert.
          version: 1.71.0
          checksum: d3de2838c68a5759ca276884254bc70df4e4ad185d6ed5f65f327b6ce6363eab
          lint: true
          format: true
          breaking: false
          push: false
          pr_comment: false
